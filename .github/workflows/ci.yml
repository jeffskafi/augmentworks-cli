name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        node:
          - 20
          - 22
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck, test, and build
        run: npm run check

      - name: Audit dependency tree
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run audit:ci

      - name: Validate committed examples
        env:
          CHATBOT_BASE_URL: http://127.0.0.1:8000
          CHATBOT_API_KEY: ci-placeholder-only
        run: |
          node dist/index.js doctor --offline -c examples/basic-chat/augmentworks.yaml
          node dist/index.js doctor --offline -c examples/refund-agent/augmentworks.yaml

      - name: Smoke-test packed npx package
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: npm run smoke:pack

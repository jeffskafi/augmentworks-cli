# yaml-language-server: $schema=[REDACTED]/schemas/v1/augmentworks.schema.json
# Stateful tool workflow. prepare/send/observe/cleanup are required together.
version: 1

target:
  name: refunds-staging
  connector: http
  base_url: ${CHATBOT_BASE_URL}

  auth:
    bearer_env: CHATBOT_API_KEY

  limits:
    request_bytes: 65536
    response_bytes: 262144
    operation_timeout_ms: 10000

  operations:
    prepare:
      method: POST
      path: /__augmentworks/prepare
      idempotent: true
      request:
        run_id: $input.run_id
        attempt_id: $input.attempt_id
        fixture: $input.fixture

    send:
      method: POST
      path: /chat
      idempotent: false
      request:
        message: $input.message.content
        attempt_id: $input.attempt_id
        turn_id: $input.turn_id
      response:
        content: $.answer
        tool_events: $.events

    observe:
      method: POST
      path: /__augmentworks/observe
      idempotent: true
      request:
        attempt_id: $input.attempt_id
        request_id: $input.request_id
        probe_keys: $input.probe_keys
      response:
        order.status: $.order.status
        order.refunded_amount: $.order.refunded_amount
        order.refundable: $.order.refundable

    cleanup:
      method: POST
      path: /__augmentworks/cleanup
      idempotent: true
      request:
        attempt_id: $input.attempt_id

telemetry:
  allow_tool_events: true
  allow_observations:
    - order.status
    - order.refunded_amount
    - order.refundable

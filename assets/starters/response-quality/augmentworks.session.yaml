# yaml-language-server: $schema=[REDACTED]/schemas/v1/augmentworks.schema.json
# Explicit session mapping for the same response-only fixture. Still no state hooks.
version: 1

target:
  name: synthetic-session-agent
  connector: http
  base_url: ${CHATBOT_BASE_URL}

  auth:
    bearer_env: CHATBOT_API_KEY

  conversation:
    strategy: explicit_session_v1

  limits:
    request_bytes: 65536
    response_bytes: 262144
    operation_timeout_ms: 10000

  operations:
    send:
      method: POST
      path: /chat
      idempotent: true
      request:
        message: $input.message.content
        conversation_id: $input.conversation_id
        turn_id: $input.turn_id
      response:
        content: $.answer
        finished: $.finished

telemetry:
  allow_tool_events: false
  allow_observations: []

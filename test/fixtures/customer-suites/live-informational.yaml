          - live.kb
  - case_id: live.starter-price
    name: Starter price
    turns:
      - content: How much is the starter plan per month?
    expected:
      facts:
        - The starter plan is $99 per month.
    criteria:
      - criterion_id: live.starter-price.required
        requirement: required
        kind: llm_rubric
        statement: The answer must state the starter plan price as $99 per month.
        reference_ids:
          - live.kb
  - case_id: live.kb-sync
    name: Knowledge-base sync
    turns:
      - content: How often do knowledge-base articles sync?
    expected:
      facts:
        - Knowledge-base articles sync once per day.
    criteria:
      - criterion_id: live.kb-sync.required
        requirement: required
        kind: llm_rubric
        statement: The answer must say knowledge-base articles sync once per day.
        reference_ids:
          - live.kb
